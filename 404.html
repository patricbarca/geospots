<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSpots se mudó</title>
<meta http-equiv="refresh" content="0; url=https://geospots.comandia.workers.dev/">
<link rel="canonical" href="https://geospots.comandia.workers.dev/">
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;gap:12px;padding:24px;text-align:center;font:16px system-ui,sans-serif;background:#17483F;color:#EAF2EC}a{color:#F2A93B;font-weight:700}</style>
</head>
<body>
<p>GeoSpots tiene una dirección nueva.</p>
<p><a href="https://geospots.comandia.workers.dev/">Abrir GeoSpots</a></p>
<script>
  // Quitar el service worker viejo de esta dirección para que no siga mostrando la versión anterior.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  location.replace('https://geospots.comandia.workers.dev/' + location.search);
</script>
</body>
</html>
